<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="container-type:inline-size;font-family:'Source Sans 3',sans-serif;font-weight:300;color:#2B2926">
  <div style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 18px;margin-bottom:28px">
    <span style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#5A554E;width:100%">{{ tFrom }}</span>
    <span style="font-family:'EB Garamond',serif;font-size:clamp(40px,4cqw,56px);line-height:1">{{ priceLabel }}</span>
    <span style="font-size:15px;letter-spacing:.04em;color:#5A554E;padding-bottom:8px">{{ perNight }} · {{ minLabel }}</span>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:rgba(43,41,38,.15);border:1px solid rgba(43,41,38,.15)">
    <button onClick="{{ pickArrival }}" style="background:{{ arriveBg }};border:0;padding:20px 18px;text-align:left;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:8px;transition:background .4s">
      <span style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5A554E">{{ tArrive }}</span>
      <span style="font-family:'EB Garamond',serif;font-size:22px;color:{{ arriveColor }}">{{ arriveLabel }}</span>
    </button>
    <button onClick="{{ pickDeparture }}" style="background:{{ departBg }};border:0;padding:20px 18px;text-align:left;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:8px;transition:background .4s">
      <span style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5A554E">{{ tDepart }}</span>
      <span style="font-family:'EB Garamond',serif;font-size:22px;color:{{ departColor }}">{{ departLabel }}</span>
    </button>
    <div style="background:#F7F4EE;padding:20px 18px;display:flex;flex-direction:column;gap:8px">
      <span style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5A554E">{{ tGuests }}</span>
      <div style="display:flex;align-items:center;gap:16px">
        <button onClick="{{ lessGuests }}" style="background:transparent;border:1px solid rgba(43,41,38,.3);width:26px;height:26px;border-radius:50%;cursor:pointer;font:inherit;color:#2B2926;line-height:1;transition:background .4s,color .4s" style-hover="background:#2B2926;color:#F3EEE6">−</button>
        <span style="font-family:'EB Garamond',serif;font-size:22px;min-width:1.4ch;text-align:center">{{ guests }}</span>
        <button onClick="{{ moreGuests }}" style="background:transparent;border:1px solid rgba(43,41,38,.3);width:26px;height:26px;border-radius:50%;cursor:pointer;font:inherit;color:#2B2926;line-height:1;transition:background .4s,color .4s" style-hover="background:#2B2926;color:#F3EEE6">+</button>
      </div>
    </div>
  </div>

  <div style="border:1px solid rgba(43,41,38,.15);border-top:0;padding:clamp(20px,3cqw,32px);background:#F7F4EE">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px">
      <button onClick="{{ prevMonth }}" disabled="{{ prevOff }}" style="background:transparent;border:0;cursor:{{ prevCursor }};font:inherit;font-size:13px;letter-spacing:.06em;color:{{ prevColor }};padding:4px 2px">{{ tEarlier }}</button>
      <span style="font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#5A554E;text-align:center">{{ rangeHint }}</span>
      <button onClick="{{ nextMonth }}" style="background:transparent;border:0;cursor:pointer;font:inherit;font-size:13px;letter-spacing:.06em;color:#2B2926;padding:4px 2px">{{ tLater }}</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:clamp(24px,4cqw,48px)">
      <sc-for list="{{ months }}" as="m" hint-placeholder-count="2">
        <div style="display:flex;flex-direction:column;gap:14px">
          <span style="font-family:'EB Garamond',serif;font-size:20px">{{ m.title }}</span>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11px;letter-spacing:.08em;color:#5A554E;text-transform:uppercase">
            <sc-for list="{{ weekdays }}" as="w" hint-placeholder-count="7">
              <span style="text-align:center;padding-bottom:4px">{{ w }}</span>
            </sc-for>
          </div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">
            <sc-for list="{{ m.days }}" as="d" hint-placeholder-count="35">
              <button onClick="{{ d.onClick }}" disabled="{{ d.disabled }}" style="aspect-ratio:1;border:0;font:inherit;font-size:14px;cursor:{{ d.cursor }};background:{{ d.bg }};color:{{ d.color }};border-radius:{{ d.radius }};transition:background .25s,color .25s;padding:0">{{ d.label }}</button>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="border:1px solid rgba(43,41,38,.15);border-top:0;padding:clamp(20px,3cqw,32px);display:flex;flex-direction:column;gap:24px">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 32px;align-items:baseline;font-size:15px">
      <span style="color:#5A554E">{{ nightsLabel }}</span>
      <span style="font-family:'EB Garamond',serif;font-size:26px">{{ totalLabel }}</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <label style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#5A554E">{{ tEmail }}</label>
      <input type="email" value="{{ email }}" onChange="{{ setEmail }}" placeholder="{{ phEmail }}" style="font:inherit;font-size:16px;color:#2B2926;background:transparent;border:0;border-bottom:1px solid #8C7F72;outline:0;padding:0 2px 8px;transition:border-color .4s" style-focus="border-color:#2B2926">
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <label style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#5A554E">{{ tNotes }}</label>
      <textarea rows="2" value="{{ notes }}" onChange="{{ setNotes }}" placeholder="{{ phNotes }}" style="font:inherit;font-size:16px;color:#2B2926;background:transparent;border:0;border-bottom:1px solid #8C7F72;outline:0;resize:none;padding:0 2px 8px;transition:border-color .4s" style-focus="border-color:#2B2926"></textarea>
    </div>
    <button onClick="{{ submit }}" disabled="{{ cannotSend }}" style="align-self:flex-start;font-size:14px;letter-spacing:.08em;font-weight:400;padding:16px 32px;background:{{ btnBg }};border:1px solid #2B2926;color:{{ btnColor }};cursor:{{ btnCursor }};transition:background .6s,color .6s" style-hover="background:#2B2926;color:#F3EEE6">{{ btnLabel }}</button>
    <span style="font-size:14px;color:#5A554E;line-height:1.6">{{ statusLabel }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;nightly&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:420,&quot;min&quot;:100,&quot;max&quot;:2000,&quot;unit&quot;:&quot;€&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Stay&quot;},&quot;minNights&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4,&quot;min&quot;:1,&quot;max&quot;:14,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Stay&quot;},&quot;maxGuests&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;min&quot;:1,&quot;max&quot;:8,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Stay&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#5C6670&quot;,&quot;options&quot;:[&quot;#5C6670&quot;,&quot;#5F6B4E&quot;,&quot;#B07A45&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Stay&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;en&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;fr&quot;,&quot;el&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Stay&quot;},&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:900}}">
const MONTHS = {
  en: ['January','February','March','April','May','June','July','August','September','October','November','December'],
  fr: ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'],
  el: ['Ιανουάριος','Φεβρουάριος','Μάρτιος','Απρίλιος','Μάιος','Ιούνιος','Ιούλιος','Αύγουστος','Σεπτέμβριος','Οκτώβριος','Νοέμβριος','Δεκέμβριος'],
};
const SHORT = {
  en: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
  fr: ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'],
  el: ['Ιαν','Φεβ','Μαρ','Απρ','Μαΐ','Ιουν','Ιουλ','Αυγ','Σεπ','Οκτ','Νοε','Δεκ'],
};
const WEEK = { en: ['M','T','W','T','F','S','S'], fr: ['L','M','M','J','V','S','D'], el: ['Δ','Τ','Τ','Π','Π','Σ','Κ'] };
const T = {
  en: { from:'From', perNight:'/ night', arrive:'Arrive', depart:'Depart', guests:'Guests', email:'Your email', notes:'Anything we should know',
        earlier:'← Earlier', later:'Later →', phEmail:'you@example.com', phNotes:'An anniversary, a late flight, a telephone number',
        min:n=>n+'-night minimum', pickIn:'choose your arrival', pickOut:'choose your departure',
        nights:(n,g)=>n+' nights, '+g+(g>1?' guests':' guest'), pickDates:'Choose your dates',
        send:'Send the request', idle:'Nothing is charged until we have written back.',
        short:n=>'Minimum stay of '+n+' nights.', needMail:'Add your email and we reply within the day.',
        thanks:(a,b)=>'Thank you. Your request is noted for '+a+' — '+b+'; we reply within the day.' },
  fr: { from:'À partir de', perNight:'la nuit', arrive:'Arrivée', depart:'Départ', guests:'Personnes', email:'Votre e-mail', notes:'Ce qu’il faut savoir',
        earlier:'← Plus tôt', later:'Plus tard →', phEmail:'vous@exemple.fr', phNotes:'Un anniversaire, un vol tardif, un numéro de téléphone',
        min:n=>'minimum '+n+' nuits', pickIn:'choisissez l’arrivée', pickOut:'choisissez le départ',
        nights:(n,g)=>n+' nuits, '+g+(g>1?' personnes':' personne'), pickDates:'Choisissez vos dates',
        send:'Envoyer la demande', idle:'Rien n’est débité avant notre réponse.',
        short:n=>'Séjour minimum de '+n+' nuits.', needMail:'Ajoutez votre e-mail et nous répondons dans la journée.',
        thanks:(a,b)=>'Merci. Votre demande est notée pour '+a+' — '+b+' ; nous répondons dans la journée.' },
  el: { from:'Από', perNight:'ανά νύχτα', arrive:'Άφιξη', depart:'Αναχώρηση', guests:'Άτομα', email:'Το email σας', notes:'Κάτι που πρέπει να ξέρουμε',
        earlier:'← Πιο πριν', later:'Πιο μετά →', phEmail:'esas@paradeigma.gr', phNotes:'Μια επέτειος, μια αργοπορημένη πτήση, ένα τηλέφωνο',
        min:n=>'ελάχιστη διαμονή '+n+' νύχτες', pickIn:'διαλέξτε άφιξη', pickOut:'διαλέξτε αναχώρηση',
        nights:(n,g)=>n+' νύχτες, '+g+' άτομα', pickDates:'Διαλέξτε ημερομηνίες',
        send:'Στείλτε το αίτημα', idle:'Δεν χρεώνεται τίποτα πριν απαντήσουμε.',
        short:n=>'Ελάχιστη διαμονή '+n+' νύχτες.', needMail:'Προσθέστε το email σας και απαντάμε μέσα στην ημέρα.',
        thanks:(a,b)=>'Ευχαριστούμε. Το αίτημά σας καταγράφηκε για '+a+' — '+b+'· απαντάμε μέσα στην ημέρα.' },
};
const iso = d => d.toISOString().slice(0,10);
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
class Component extends DCLogic {
  state = { offset: 0, start: null, end: null, guests: 2, email: '', notes: '', sent: false, focus: 'start' };
  lang() { const l = this.props.lang; return (l === 'fr' || l === 'el') ? l : 'en'; }
  fmt(d) { if (!d) return '—'; return d.getDate() + ' ' + SHORT[this.lang()][d.getMonth()]; }
  pick(day) {
    const { start, end, focus } = this.state;
    if (focus === 'end' && start && day > start) { this.setState({ end: day, focus: 'start', sent: false }); return; }
    if (!start || end || day <= start) { this.setState({ start: day, end: null, focus: 'end', sent: false }); return; }
    this.setState({ end: day, focus: 'start', sent: false });
  }
  renderVals() {
    const lang = this.lang();
    const t = T[lang];
    const locale = { en: 'en-GB', fr: 'fr-FR', el: 'el-GR' }[lang];
    const nightly = Number(this.props.nightly ?? 420);
    const minNights = Number(this.props.minNights ?? 4);
    const maxGuests = Number(this.props.maxGuests ?? 2);
    const { start, end, guests, email, notes, sent, offset, focus } = this.state;
    const today = new Date(); today.setHours(0,0,0,0);
    const base = new Date(today.getFullYear(), today.getMonth() + offset, 1);
    const months = [0,1].map(k => {
      const first = new Date(base.getFullYear(), base.getMonth() + k, 1);
      const lead = (first.getDay() + 6) % 7;
      const count = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
      const days = [];
      for (let i = 0; i < lead; i++) days.push({ label:'', disabled:true, cursor:'default', bg:'transparent', color:'transparent', radius:'0', onClick:()=>{} });
      for (let n = 1; n <= count; n++) {
        const d = new Date(first.getFullYear(), first.getMonth(), n);
        const past = d < today;
        const isStart = start && iso(d) === iso(start);
        const isEnd = end && iso(d) === iso(end);
        const inRange = start && end && d > start && d < end;
        days.push({
          label: String(n),
          disabled: past,
          cursor: past ? 'default' : 'pointer',
          bg: isStart || isEnd ? '#2B2926' : inRange ? '#E7E1D6' : 'transparent',
          color: past ? '#A9A193' : isStart || isEnd ? '#F3EEE6' : '#2B2926',
          radius: isStart || isEnd ? '50%' : '0',
          onClick: past ? () => {} : () => this.pick(d),
        });
      }
      return { title: MONTHS[lang][first.getMonth()] + ' ' + first.getFullYear(), days };
    });
    const nights = start && end ? Math.round((end - start) / 86400000) : 0;
    const short = nights > 0 && nights < minNights;
    const canSend = nights >= minNights && /.+@.+\..+/.test(email);
    return {
      months, weekdays: WEEK[lang], guests, email, notes,
      tFrom: t.from, perNight: t.perNight, tArrive: t.arrive, tDepart: t.depart, tGuests: t.guests,
      tEmail: t.email, tNotes: t.notes, tEarlier: t.earlier, tLater: t.later, phEmail: t.phEmail, phNotes: t.phNotes,
      priceLabel: '€' + nightly,
      minLabel: t.min(minNights),
      arriveLabel: this.fmt(start), departLabel: this.fmt(end),
      arriveColor: start ? '#2B2926' : '#5A554E', departColor: end ? '#2B2926' : '#5A554E',
      arriveBg: focus === 'start' ? '#EFEAE1' : '#F7F4EE', departBg: focus === 'end' ? '#EFEAE1' : '#F7F4EE',
      pickArrival: () => this.setState({ focus: 'start' }), pickDeparture: () => this.setState({ focus: 'end' }),
      lessGuests: () => this.setState({ guests: Math.max(1, guests - 1) }),
      moreGuests: () => this.setState({ guests: Math.min(maxGuests, guests + 1) }),
      prevMonth: () => this.setState({ offset: Math.max(0, offset - 1) }),
      nextMonth: () => this.setState({ offset: Math.min(23, offset + 1) }),
      prevColor: offset === 0 ? '#8C7F72' : '#2B2926',
      prevOff: offset === 0, prevCursor: offset === 0 ? 'default' : 'pointer',
      rangeHint: focus === 'end' && start ? t.pickOut : t.pickIn,
      nightsLabel: nights ? t.nights(nights, guests) : t.pickDates,
      totalLabel: nights ? '€' + (nights * nightly).toLocaleString(locale) : '',
      setEmail: e => this.setState({ email: e.target.value, sent: false }),
      setNotes: e => this.setState({ notes: e.target.value }),
      submit: () => { if (canSend) this.setState({ sent: true }); },
      cannotSend: !canSend,
      btnBg: 'transparent',
      btnColor: canSend ? '#2B2926' : '#7C7568',
      btnCursor: canSend ? 'pointer' : 'default',
      btnLabel: t.send,
      statusLabel: sent ? t.thanks(this.fmt(start), this.fmt(end))
        : short ? t.short(minNights)
        : nights && !/.+@.+\..+/.test(email) ? t.needMail
        : t.idle,
    };
  }
}
</script>
</body>
</html>
