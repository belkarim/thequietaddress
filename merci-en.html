<!DOCTYPE html>

<head>

<title>It’s confirmed — The Quiet Address</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Source+Sans+3:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#F3EEE6;color:#2B2926;font-family:'Source Sans 3',sans-serif;font-weight:300;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .page{min-height:100vh;display:flex;flex-direction:column}
  .mark{padding:24px 20px 0;display:flex;justify-content:center}
  .mark a{font-family:'EB Garamond',serif;font-size:26px;letter-spacing:.005em;color:#2B2926;text-decoration:none;transition:color .5s}
  .mark a:hover{color:#5C6670}
  .inner{box-sizing:border-box;max-width:560px;width:100%;margin:0 auto;padding:clamp(48px,12vw,96px) clamp(20px,5vw,40px) clamp(40px,8vw,72px);display:flex;flex-direction:column;gap:20px;flex:1}
  h1{margin:0;font-family:'EB Garamond',serif;font-weight:400;font-size:clamp(30px,8vw,40px);line-height:1.12;letter-spacing:-.005em;text-wrap:pretty}
  p{margin:0;color:#5A554E}
  .foot{border-top:1px solid rgba(43,41,38,.12);margin-top:clamp(20px,5vw,32px);padding-top:24px}
  .foot a{font-size:14px;letter-spacing:.04em;font-weight:400;text-decoration:none;color:#2B2926;border-bottom:1px solid rgba(43,41,38,.3);padding-bottom:3px;transition:color .5s,border-color .5s}
  .foot a:hover{color:#5C6670;border-color:#5C6670}
</style>
</head>
<body>
<div class="page">
  <div class="mark"><a href="index.html">The Quiet Address</a></div>
  <div class="inner">

    <p>We will write when a date frees up or a new address opens.</p>
    <div class="foot"><a href="City.dc.html">See the apartments →</a></div>
  </div>
</div>
</body>
</html>
